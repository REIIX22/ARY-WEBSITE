<!DOCTYPE html>
<html lang="en">
<head>

  <title>Zaxky | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Oxanium', sans-serif;
      background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
      color: #fff;
      min-height: 100vh;
      text-align: center;
    }

    header {
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 2.8rem;
      color: #00ffd5;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 15px;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #00ffd5;
    }

    .hero {
      padding: 100px 20px;
    }

    .hero h2 {
      font-size: 2.5rem;
      color: #00ffd5;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ffd5aa;
    }

    .hero p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #00ffd5;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
      box-shadow: 0 0 15px #00ffd5aa;
    }

    .btn:hover {
      background: #00e0c0;
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      color: #666;
      border-top: 1px solid #333;
      font-size: 0.85rem;
    }
  </style>
</head>
